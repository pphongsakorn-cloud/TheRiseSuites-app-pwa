<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#f7f1e5">

  <title>The Rise Suites | Meeting Room Booking</title>

  <link rel="manifest" href="manifest.json">

  <link rel="apple-touch-icon" href="icon-192.png">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 20% 15%,
          rgba(255,255,255,0.95),
          transparent 35%
        ),

        linear-gradient(
          180deg,
          #fffdf8 0%,
          #f6eee0 100%
        );

      color: #3d3428;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;

      overflow-x: hidden;
    }


    /* Main Card */

    .app {

      width: 100%;

      max-width: 520px;

      text-align: center;

      padding: 42px 34px 30px;

      background:
        rgba(255,255,255,0.84);

      border:
        1px solid rgba(190,150,70,0.22);

      border-radius: 30px;

      box-shadow:
        0 22px 60px rgba(105,78,38,0.12),
        inset 0 1px 0 rgba(255,255,255,0.8);

      backdrop-filter: blur(10px);
    }


    /* Official Hotel Logo */

    .logo {

      display: block;

      width: 100%;

      max-width: 390px;

      height: auto;

      margin: 0 auto 34px;

      border-radius: 8px;

      box-shadow:
        0 8px 24px rgba(130,100,40,0.08);
    }


    /* Welcome */

    .welcome {

      font-size: 19px;

      color: #756754;

      margin-bottom: 12px;
    }


    /* System Name */

    .system-name {

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 34px;

      line-height: 1.25;

      font-weight: 500;

      color: #3d3428;

      margin-bottom: 12px;
    }


    /* Thai Name */

    .thai-name {

      font-size: 16px;

      color: #9a8060;

      margin-bottom: 30px;
    }


    /* Divider */

    .divider {

      width: 62px;

      height: 2px;

      background:
        linear-gradient(
          90deg,
          #c49a4c,
          #e0bd78
        );

      margin:
        0 auto 30px;

      border-radius: 10px;
    }


    /* Login Button */

    .login-button {

      width: 100%;

      padding: 18px 20px;

      border:
        1px solid #c29442;

      border-radius: 16px;

      background:
        linear-gradient(
          180deg,
          #edcc82 0%,
          #d8ad58 100%
        );

      color: #3d3020;

      font-size: 19px;

      font-weight: 650;

      cursor: pointer;

      box-shadow:
        0 9px 22px rgba(170,125,45,0.22),
        inset 0 1px 0 rgba(255,255,255,0.45);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        filter 0.15s ease;
    }


    .login-button:hover {

      filter: brightness(1.03);

      box-shadow:
        0 11px 26px rgba(170,125,45,0.26);
    }


    .login-button:active {

      transform: scale(0.985);

      box-shadow:
        0 4px 12px rgba(170,125,45,0.16);
    }


    /* Loading */

    .loading {

      display: none;

      margin-top: 14px;

      font-size: 13px;

      color: #9a8567;
    }


    /* Footer */

    .footer {

      margin-top: 30px;

      padding-top: 18px;

      border-top:
        1px solid rgba(180,145,80,0.16);

      font-size: 12px;

      color: #a99982;

      line-height: 1.7;
    }


    /* Mobile */

    @media (max-width: 480px) {

      body {

        padding: 14px;
      }


      .app {

        padding:
          30px
          22px
          24px;

        border-radius: 26px;
      }


      .logo {

        width: 100%;

        margin-bottom: 28px;
      }


      .system-name {

        font-size: 28px;
      }


      .login-button {

        padding: 17px 14px;
      }
    }


    @media (max-width: 360px) {

      .app {

        padding:
          26px
          18px
          22px;
      }


      .system-name {

        font-size: 24px;
      }
    }

  </style>

</head>


<body>


  <main class="app">


    <!-- Official The Rise Suites Logo -->

    <img
      src="logo.png"
      alt="The Rise Suites"
      class="logo"
    >


    <!-- Welcome -->

    <div class="welcome">

      Welcome to The Rise Suites Hotel

    </div>


    <!-- System -->

    <div class="system-name">

      Hotel Meeting Room<br>
      Booking System

    </div>


    <!-- Thai -->

    <div class="thai-name">

      ระบบจองห้องประชุมโรงแรม

    </div>


    <!-- Divider -->

    <div class="divider"></div>


    <!-- Login -->

    <button
      class="login-button"
      onclick="openApp()">

      🔐 &nbsp; Sign in / เข้าสู่ระบบ

    </button>


    <div
      id="loading"
      class="loading">

      กำลังเปิดระบบ...

    </div>


    <!-- Footer -->

    <div class="footer">

      The Rise Suites App<br>

      Version 1.0

    </div>


  </main>


  <script>

    function openApp() {

      document.getElementById("loading").style.display =
        "block";


      const appUrl =
        "https://script.google.com/macros/s/AKfycbwksD5p1cqu5rLZ3OdY8bkycDCTkKebiPH8_TcMiI0CpW0zVEASFdAvyw40Z6fZ94mSQQ/exec";


      setTimeout(function() {

        window.location.href = appUrl;

      }, 250);

    }

  </script>


</body>

</html>
